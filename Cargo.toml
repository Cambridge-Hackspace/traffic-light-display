[package]
name = "traffic-light-display"
version = "0.2.0"
authors = ["Caleb L. Power <cpower@axonibyte.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "traffic-light-display"
# Keep the test build out of rust-analyzer's default (--all-targets) checks on the
# xtensa target, where the `test` crate is not built. Unit tests run on the host:
#   cargo +stable test --target x86_64-unknown-linux-gnu --bin traffic-light-display
test = false

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
smart-leds = "0.4.0"

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "=0.28.1"
esp-idf-hal = "0.45"
esp-idf-svc = { version = "0.51.0", features = ["critical-section"] }
ws2812-esp32-rmt-driver = { version = "0.13.1", features = ["smart-leds-trait"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[features]
console-sim = []