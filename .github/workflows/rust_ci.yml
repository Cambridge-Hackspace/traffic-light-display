name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  shell-checks:
    name: Flashing Scripts
    runs-on: ubuntu-latest
    # Deliberately its own job rather than another matrix entry: every entry of
    # the matrix above installs the xtensa toolchain, and none of this needs it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Script self-test
        run: scripts/ota-push.sh --self-test
      - name: Push script end-to-end tests
        run: scripts/test-ota-push.sh
